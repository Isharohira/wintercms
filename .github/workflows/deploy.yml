name: Deploy to EC2

on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Pick one instance for migration
        id: pick
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:aws:autoscaling:groupName,Values=laravel-ASG" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)
          echo "Selected instance: $INSTANCE_ID"
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      - name: Run migration on selected instance
        run: |
          aws ssm send-command \
            --instance-ids "${{ steps.pick.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Run DB migration once" \
            --parameters '{"commands":[
              "cd /var/www/laravel",
              "git config --global --add safe.directory /var/www/laravel",
              "git pull origin prod",
              "composer install --no-dev --optimize-autoloader",
              "php artisan package:discover",
              "php artisan winter:up",
              "php artisan route:clear",
              "php artisan route:cache",
              "php artisan winter:mirror public --relative",
              "chown -R www-data:www-data /var/www/laravel /mnt/efs/storage /mnt/efs/uploads",
              "systemctl restart php8.2-fpm"
            ]}' \
            --output text

      - name: Wait for migration to finish
        run: sleep 20

      - name: Deploy to all ASG instances (no migration)
        run: |
          aws ssm send-command \
            --targets "Key=tag:aws:autoscaling:groupName,Values=laravel-ASG" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy code to all instances" \
            --parameters '{"commands":[
              "cd /var/www/laravel",
              "git config --global --add safe.directory /var/www/laravel",
              "git pull origin prod",
              "composer install --no-dev --optimize-autoloader",
              "php artisan package:discover",
              "php artisan route:clear",
              "php artisan route:cache",
              "php artisan winter:mirror public --relative",
              "chown -R www-data:www-data /var/www/laravel /mnt/efs/storage /mnt/efs/uploads",
              "systemctl restart php8.2-fpm"
            ]}' \
            --output text
